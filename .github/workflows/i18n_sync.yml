name: Sync i18n files

on:
  schedule:
    - cron: "0 12 * * *"
  push:
    branches: [main]
    paths:
      - "src/lang/en/**"
  workflow_dispatch:

jobs:
  sync_i18n:
    name: Generate and i18n files
    runs-on: ubuntu-latest
    env:
      SYNC_PR_BRANCH: ${{ vars.SYNC_LANG_PR_BRANCH || 'chore/auto-update-i18n' }}
      SYNC_TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: backend/go.sum
      - name: Checkout frontend codes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout backend codes
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.SYNC_LANG_ENV_BACKEND_REPOSITORY || 'OpenListTeam/OpenList' }}
          ref: main
          path: backend
          fetch-depth: 0
          submodules: recursive

      - name: Generate and update lang files
        run: |
          cd backend
          go run ./main.go lang --frontend-path ../
          cd ..

      - name: Check for changes and stage
        id: verify-changed-files
        run: |
          cp -f ./backend/lang/*.json ./src/lang/en/ 2>/dev/null || :
          if git diff --quiet HEAD -- src/lang/en/; then
            echo "No changes detected in src/lang/en/"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in src/lang/en/"
            git add src/lang/en/
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup git identity (fork-friendly)
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git commit -m "chore: auto update i18n file" || echo "No changes to commit"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            git push
          fi

      # Optional: Node setup if you plan to run scripts that depend on pnpm
      - name: Setup Node
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install dependencies
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: pnpm install

      - name: Skip Crowdin (fork)
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: echo "Skipping Crowdin sync in fork"
