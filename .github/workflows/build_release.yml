# This workflow is used to create a (pre-)release build of the OpenList frontend.
#
# This will:
#
# - Update the `package.json` version to the specified version (when triggered
#   by `workflow_dispatch`), commit the changes and tag it.
# - Upload the release assets to GitHub.
# - Publish the package to npm.
#
# # Usage
#
# This workflow can be triggered by:
#
# - Pushing a tag that matches the pattern `v[0-9]+.[0-9]+.[0-9]+*` (semver format).
# - Manually via the GitHub Actions UI with a version input.
#
# To create (pre-)release builds, we recommend that you use the `workflow_dispatch`.

name: Release Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

  workflow_dispatch:
    inputs:
      version:
        description: |
          Target version (e.g., 1.0.0), will create a tag named 'v<version>' and update package.json version
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate semver
        id: semver
        uses: matt-usurp/validate-semver@v3.0.0
        with:
          version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

      - name: Check pre-release
        id: check_pre_release
        run: |
          if [[ -z "${{ steps.semver.outputs.prerelease }}" && -z "${{ steps.semver.outputs.build }}" ]]; then
            echo "is_pre_release=false" >> $GITHUB_OUTPUT
          else
            echo "is_pre_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node (build only)
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup git identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      # Only for manual release
      - name: Update package.json and create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.semver.outputs.version }}"

          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

          git add package.json
          git commit -m "chore: release v$VERSION" || true

          git tag -a "v$VERSION" -m "Release v$VERSION"

          git push origin HEAD --follow-tags

      - name: Get current tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev_tag
        run: |
          CURRENT="${{ steps.get_tag.outputs.tag }}"
          PREV=$(git tag --sort=-version:refname | grep -v "^$CURRENT$" | head -n 1 || true)
          echo "prev=$PREV" >> $GITHUB_OUTPUT

      - name: Generate changelog (safe per-release)
        run: |
          CURRENT="${{ steps.get_tag.outputs.tag }}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          OUT="${{ github.workspace }}-CHANGELOG.txt"

          echo "Current: $CURRENT"
          echo "Previous: $PREV"

          if [ -n "$PREV" ]; then
            git log --pretty=format:"- %s (%h)" "$PREV..$CURRENT" > "$OUT"
          else
            git log --pretty=format:"- %s (%h)" -n 50 > "$OUT"
          fi

          [ -s "$OUT" ] || echo "No changes" > "$OUT"

      - name: Build normal release
        run: |
          chmod +x build.sh
          ./build.sh --release --compress --skip-i18n

      - name: Save normal dist
        run: |
          mkdir -p regular-dist
          mv dist/* regular-dist/

      - name: Build lite release
        run: |
          chmod +x build.sh
          ./build.sh --release --compress --lite --skip-i18n

      - name: Prepare dist packages
        run: |
          mkdir -p lite-dist
          mv dist/* lite-dist/
          mv regular-dist/* dist/

      - name: Create GitHub Release
        run: |
          gh release create \
            "${{ steps.get_tag.outputs.tag }}" \
            --title "Release ${{ steps.get_tag.outputs.tag }}" \
            --notes-file "${{ github.workspace }}-CHANGELOG.txt" \
            --prerelease=${{ steps.check_pre_release.outputs.is_pre_release }} \
            dist/openlist-frontend-dist-v*.tar.gz \
            lite-dist/openlist-frontend-dist-lite-v*.tar.gz \
            dist/i18n.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}

permissions:
  contents: write
